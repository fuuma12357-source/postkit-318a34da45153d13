<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-title" content="投稿キット">
<title>投稿キット</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f4efe4;
    --card: #ffffff;
    --ink: #1a1005;
    --muted: #6b5d48;
    --rule: #e2d8c4;
    --accent: #ff7a2f;
    --on-accent: #1a1005;
    --ok: #1f7a4d;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --card: #182033;
      --ink: #f1ece2;
      --muted: #a9b0c0;
      --rule: #2a3550;
      --ok: #5fd39a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  header { padding: 16px 0 8px; }
  h1 { font-size: 20px; margin: 0; }
  .days { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 4px; -webkit-overflow-scrolling: touch; }
  .days button {
    flex: 0 0 auto; min-height: 44px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--rule); background: var(--card); color: var(--ink); font: inherit; font-size: 15px;
  }
  .days button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .video-card { margin: 12px 0 8px; background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px; }
  video { display: block; aspect-ratio: 9 / 16; height: min(52vh, 480px); width: auto; max-width: 100%; margin: 0 auto; background: #000; border-radius: 10px; }
  .status { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
  .status.ready { color: var(--ok); }
  .save { display: inline-block; margin-top: 4px; font-size: 14px; color: var(--muted); padding: 10px 0; min-height: 44px; }
  .post { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px; margin: 12px 0; }
  .post h2 { font-size: 16px; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .count { font-size: 13px; font-weight: normal; color: var(--muted); }
  .text { white-space: pre-wrap; word-break: break-word; margin: 0 0 12px; font-size: 15px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button {
    min-height: 48px; border-radius: 12px; font: inherit; font-weight: 600; font-size: 15px;
    border: 1px solid var(--rule); background: var(--bg); color: var(--ink);
  }
  .actions button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .actions button:disabled { opacity: .5; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .empty { color: var(--muted); padding: 24px 0; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 15px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>投稿キット</h1>
    <nav class="days" id="days" aria-label="日付"></nav>
  </header>

  <section class="video-card" aria-label="動画">
    <video id="video" playsinline muted controls preload="auto"></video>
    <p class="status" id="status" role="status">読み込み中…</p>
    <a class="save" id="save" href="#" download>共有できない場合は動画を保存</a>
  </section>

  <div id="posts"></div>
</main>
<div class="toast" id="toast" aria-live="polite"></div>

<script>
(() => {
  const SNS = [
    { key: "x_ja", label: "X(日本語)", unit: "x" },
    { key: "x_en", label: "X(English)", unit: "x" },
    { key: "threads", label: "Threads", unit: 500 },
    { key: "bluesky", label: "Bluesky", unit: 300 },
    { key: "tiktok", label: "TikTok", unit: 2200 },
  ];
  const $ = (id) => document.getElementById(id);
  let days = [];
  let current = null;
  let videoFile = null;
  let loadToken = 0;

  const xLength = (t) => {
    let n = 0;
    for (const ch of t) {
      const cp = ch.codePointAt(0);
      const light = cp <= 0x10ff || (cp >= 0x2000 && cp <= 0x200d) || (cp >= 0x2010 && cp <= 0x201f) || (cp >= 0x2032 && cp <= 0x2037);
      n += light ? 1 : 2;
    }
    return n;
  };
  const countLabel = (s, text) =>
    s.unit === "x" ? `${xLength(text)}/280` : `${[...text].length}/${s.unit}`;

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    }
  }

  // 共有はタップの中で「すぐ」呼ぶ(await を挟むと iOS が共有を拒否する)。
  // そのため動画はページを開いた時点で File にしておく。
  function shareVideo() {
    if (!videoFile) {
      toast("動画を読み込み中です");
      return;
    }
    const data = { files: [videoFile] };
    if (!navigator.canShare || !navigator.canShare(data)) {
      toast("共有に対応していません。下の「動画を保存」を使ってください");
      return;
    }
    navigator.share(data).catch((err) => {
      if (err && err.name !== "AbortError") toast("共有できませんでした");
    });
  }

  function renderDays() {
    const nav = $("days");
    nav.textContent = "";
    for (const d of days) {
      const b = document.createElement("button");
      b.type = "button";
      if (d.label) {
        b.textContent = d.label;
      } else {
        const [, m, dd] = d.date.split("-");
        b.textContent = d === days[0] ? `最新 ${Number(m)}/${Number(dd)}` : `${Number(m)}/${Number(dd)}`;
      }
      b.setAttribute("aria-pressed", String(d === current));
      b.addEventListener("click", () => select(d));
      nav.appendChild(b);
    }
  }

  function renderPosts() {
    const wrap = $("posts");
    wrap.textContent = "";
    for (const s of SNS) {
      const text = current.posts[s.key] || "";
      if (!text) continue; // 古い日の分には TikTok の文章が無い
      const sec = document.createElement("section");
      sec.className = "post";
      const h = document.createElement("h2");
      h.textContent = s.label;
      const c = document.createElement("span");
      c.className = "count";
      c.textContent = countLabel(s, text);
      h.appendChild(c);
      const p = document.createElement("p");
      p.className = "text";
      p.textContent = text;
      const actions = document.createElement("div");
      actions.className = "actions";
      const copy = document.createElement("button");
      copy.type = "button";
      copy.textContent = "文章をコピー";
      copy.addEventListener("click", async () => toast((await copyText(text)) ? `${s.label} の文章をコピーしました` : "コピーできませんでした"));
      const share = document.createElement("button");
      share.type = "button";
      share.className = "primary share";
      share.textContent = "動画を共有";
      share.disabled = !videoFile;
      share.addEventListener("click", shareVideo);
      actions.append(copy, share);
      sec.append(h, p, actions);
      wrap.appendChild(sec);
    }
  }

  async function loadVideo(day) {
    const token = ++loadToken;
    videoFile = null;
    const status = $("status");
    status.className = "status";
    status.textContent = "動画を読み込み中…";
    $("save").href = day.video;
    $("save").setAttribute("download", `stationery-blast-${day.date}.mp4`);
    try {
      const res = await fetch(day.video, { cache: "force-cache" });
      if (!res.ok) throw new Error(res.status);
      const blob = await res.blob();
      if (token !== loadToken) return;
      videoFile = new File([blob], `stationery-blast-${day.date}.mp4`, { type: "video/mp4" });
      const v = $("video");
      if (v.dataset.url) URL.revokeObjectURL(v.dataset.url);
      v.dataset.url = URL.createObjectURL(blob);
      v.src = v.dataset.url;
      status.className = "status ready";
      status.textContent = `動画の準備OK(${(blob.size / 1048576).toFixed(1)}MB)`;
      document.querySelectorAll(".share").forEach((b) => (b.disabled = false));
    } catch {
      if (token !== loadToken) return;
      status.textContent = "動画を読み込めませんでした。下の「動画を保存」を試してください";
    }
  }

  function select(day) {
    current = day;
    renderDays();
    renderPosts();
    loadVideo(day);
  }

  fetch(`days.json?t=${Date.now()}`, { cache: "no-store" })
    .then((r) => r.json())
    .then((list) => {
      days = list;
      if (!days.length) {
        $("posts").innerHTML = '<p class="empty">まだ投稿がありません。</p>';
        $("status").textContent = "";
        return;
      }
      select(days[0]);
    })
    .catch(() => {
      $("status").textContent = "一覧を読み込めませんでした。再読み込みしてください";
    });
})();
</script>
</body>
</html>
